<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<title>კურიერის ჯიბე</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1014; --card:#171A21; --card2:#20242D; --line:#272C36;
  --text:#F2F4F7; --muted:#8E97A6; --accent:#FFB020; --accent-ink:#1A1206;
  --green:#2BD47D; --red:#FF4D4F;
  --r:16px;
}
html[data-theme="light"]{
  --bg:#F3F4F6; --card:#FFFFFF; --card2:#F1F3F6; --line:#E3E6EB;
  --text:#14161A; --muted:#677083; --accent:#F59E0B; --accent-ink:#1A1206;
  --green:#15993F; --red:#E5383B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}

/* ზედა ზოლი */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.top img{width:32px;height:32px;border-radius:9px}
.top b{display:block;font-size:16px;font-weight:700;line-height:1.2}
.top small{display:block;color:var(--muted);font-size:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}

main{padding:2px 14px calc(96px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.head h3{margin:0;font-size:16px;font-weight:700}
.page-h{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.page-h h2{margin:0;font-size:20px;font-weight:800}
.add{height:36px;padding:0 14px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;flex:none}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px}

/* მთავარი: დღის ბარათი */
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
.money{font-size:34px;font-weight:800;line-height:1.1;color:var(--green);margin:2px 0}
.stepper{display:flex;align-items:center;background:var(--card2);border-radius:12px;margin-top:4px}
.stepper button{width:36px;height:44px;border:0;background:transparent;font-size:20px;font-weight:700;color:var(--muted)}
.stepper input{width:44px;height:44px;border:0;background:transparent;text-align:center;font-size:20px;font-weight:800;outline:none;padding:0}
.stepper span{font-weight:700;color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s}
.bar-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.bar-meta .link{font-size:13px}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;border:0;
  font-weight:700;font-size:16px;background:var(--card2);color:var(--text);padding:0 14px}
.btn.go{background:var(--green);color:#04210F}
.btn.stop{background:var(--red);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.side{width:auto;flex:none;font-size:14px;color:var(--muted)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini{background:var(--card2);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:6px;min-height:50px}
.mini input{width:52px;border:0;background:transparent;font-size:17px;font-weight:800;outline:none;padding:0;text-align:right}
.mini input::placeholder{color:var(--muted);opacity:.7}
.mini b{color:var(--accent);white-space:nowrap}
.rest{margin-top:10px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 15%,var(--card2));font-size:14px}
.strip{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);margin-bottom:10px;font-size:14px}
.strip .e{font-size:22px}

/* სიები */
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;min-height:54px}
.rows .r:first-child{border-top:0}
.r .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .s.warn{color:var(--red)}
.r .s.two{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.check{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;font-weight:800;font-size:14px;padding:0}
.r.paid{opacity:.5}
.r.paid .check{background:var(--green);border-color:var(--green);color:#04210F}
.r.paid .t{text-decoration:line-through}
.pill{flex:none;font-weight:800;font-size:14px;padding:5px 9px;border-radius:9px;white-space:nowrap;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
html[data-theme="light"] .pill{color:#995800}
.pill.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.gray{background:var(--card2);color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:14px}
.total b{font-size:16px}
.e-ic{width:38px;height:38px;flex:none;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:19px}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
details summary{list-style:none;cursor:pointer;color:var(--muted);font-size:13px;padding:8px 0 0}
details summary::-webkit-details-marker{display:none}

/* ჩიპები */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:10px}
.seg button{height:40px;border:0;border-radius:11px;background:transparent;font-weight:700;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card2);color:var(--text)}

/* SOS */
.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prob{border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:12.5px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px;justify-content:center}
.prob .e{font-size:21px}
.prob.on{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 14%,var(--card2))}
.loc{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--green)}
.dot.bad{background:var(--red)}
.sos-btn{min-height:60px;font-size:17px;margin-bottom:8px}
.help-btn{margin-bottom:10px;border:1px solid var(--line);background:var(--card)}
.call{width:42px;height:42px;flex:none;border-radius:12px;background:var(--green);color:#04210F;display:grid;place-items:center}
.call svg{width:20px;height:20px}
.av{width:38px;height:38px;flex:none;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;color:var(--accent)}
.alert{border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--red) 15%,var(--card2));font-size:14px;margin-top:10px}
.p112{height:36px;padding:0 12px;border-radius:99px;border:1.5px solid var(--red);color:var(--red);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}

/* წიგნები */
.quote .q{font-size:17px;line-height:1.5;font-weight:600;margin:6px 0 6px}
.quote .a{color:var(--muted);font-size:13px}
.qb{width:36px;height:36px;border-radius:10px;border:0;background:var(--card2);font-size:15px}
.src{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.src a{text-decoration:underline}

/* კითხვა */
#reader{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.r-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.r-top .t{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-body{flex:1;overflow-y:auto;padding:18px 20px calc(36px + env(safe-area-inset-bottom))}
.r-inner{max-width:620px;margin:0 auto}
.r-inner h1{font-size:1.4em;margin:0}
.r-inner .by{color:var(--muted);margin:2px 0 20px;font-size:.85em}
.stanza{margin:0 0 1.1em;line-height:1.7}
.r-inner h3{margin:1.5em 0 .6em;color:var(--accent);text-align:center}
.r-inner p{margin:0 0 1em;line-height:1.75}
.r-end{text-align:center;color:var(--muted);margin-top:24px;font-size:13px}

/* ქვედა მენიუ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 95%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600;min-height:54px;justify-content:center}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}
.tab .sosb{width:54px;height:54px;margin-top:-24px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;border:4px solid var(--bg)}
.tab.sos.on{color:var(--red)}

/* ქვედა ფანჯარა */
.sheet-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet{width:100%;max-width:540px;max-height:90vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 12px;font-size:18px}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 2px;font-weight:600}
.f{width:100%;height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:16px;outline:none}
textarea.f{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.f:focus{border-color:var(--accent)}
.btn-row{display:flex;gap:8px;margin-top:4px}
.btn-row .btn{flex:1}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.plain{background:transparent;color:var(--muted);min-height:44px}
.switch{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.switch button{flex:1;height:42px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--muted)}
.switch button.on{background:var(--card);color:var(--text)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);opacity:0;z-index:99;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="top">
  <img src="icon.svg" alt="">
  <div class="grow"><b>კურიერის ჯიბე</b><small id="today-label"></small></div>
  <button class="icon-btn" data-action="open-settings" aria-label="პარამეტრები">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
  </button>
</header>

<main id="app"></main>

<nav class="tabs" aria-label="მენიუ">
  <button class="tab" data-tab="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>მთავარი</button>
  <button class="tab" data-tab="discounts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.6" fill="currentColor"/></svg>ფასდაკლება</button>
  <button class="tab sos" data-tab="sos"><span class="sosb">SOS</span></button>
  <button class="tab" data-tab="books">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg>წიგნები</button>
  <button class="tab" data-tab="jobs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>სამუშაო</button>
</nav>

<div id="sheet" class="sheet-wrap" hidden></div>
<div id="reader" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ დამხმარეები ============ */
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['იანვარი','თებერვალი','მარტი','აპრილი','მაისი','ივნისი','ივლისი','აგვისტო','სექტემბერი','ოქტომბერი','ნოემბერი','დეკემბერი'];
const MON_S = ['იან','თებ','მარ','აპრ','მაი','ივნ','ივლ','აგვ','სექ','ოქტ','ნოე','დეკ'];
const DAYS = ['კვირა','ორშაბათი','სამშაბათი','ოთხშაბათი','ხუთშაბათი','პარასკევი','შაბათი'];
const pad = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const money = x => { const v = Math.round((+x || 0) * 100) / 100; return (Number.isInteger(v) ? v : v.toFixed(2)) + ' ₾'; };
function fmtH(hours){
  if (!isFinite(hours) || hours < 0) return '—';
  let m = Math.round(hours * 60); const h = Math.floor(m / 60); m %= 60;
  if (h && m) return `${h} სთ ${m} წთ`;
  if (h) return `${h} სთ`;
  return `${m} წთ`;
}
const clock = min => { const s = Math.floor(min * 60); return `${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`; };
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
const ICON_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>';

/* ============ მონაცემები (ინახება ტელეფონში) ============ */
const KEY = 'kurieris-jibe-v1';
const TBC = { id: 'tbc-glovo', name: 'Glovo-ს პარტნიორის ბარათი (თიბისი)', cat: 'money', pct: '', addr: '',
  note: 'Glovo-ს კურიერებს: ფასდაკლება და ქეშბექი სამუშაოსთვის საჭირო ნივთებზე. ბარათი Glovo Rider აპიდან იწერება.' };
const DEFAULT = () => ({
  v: 2, rate: 15, goal: 8, name: '', theme: 'dark', font: 19,
  expenses: [
    { id: uid(), name: 'ნიკას ვალი', amount: 100, due: '', paid: false },
    { id: uid(), name: 'ბანკი', amount: 300, due: '', paid: false },
    { id: uid(), name: 'ქირა', amount: 400, due: '', paid: false },
  ],
  shift: null, log: {},
  discounts: [
    { id: 'bingo', name: 'ბინგო შაურმა', cat: 'food', pct: '', addr: '', note: 'კურიერებს ფასდაკლება აქვთ. პროცენტი დასაზუსტებელია.' },
    { ...TBC },
  ],
  jobs: [], contacts: [], read: {}, last: null, phraseShift: 0,
});
let S, saved = null;
try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
S = Object.assign(DEFAULT(), saved || {});
if (saved && (saved.v || 1) < 2) {            // ძველი ვერსიიდან: ნიმუშების მოშლა
  S.discounts = (S.discounts || []).filter(d => !d.sample);
  if (!S.discounts.some(d => d.id === TBC.id)) S.discounts.push({ ...TBC });
  S.jobs = (S.jobs || []).filter(j => !j.sample);
  (S.expenses || []).forEach(e => delete e.sample);
  S.v = 2;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
save();
const todayLog = () => (S.log[dayKey()] ||= { min: 0, earn: 0, fuel: 0 });

/* ============ ნავიგაცია ============ */
const TABS = ['home', 'discounts', 'sos', 'books', 'jobs'];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
function go(t){
  tab = t;
  if (location.hash.slice(1) !== t) { try { history.replaceState(null, '', '#' + t); } catch (e) {} }
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  render(); window.scrollTo(0, 0);
  if (t === 'sos' && loc.state !== 'ok') findLocation();
}

function viewExpenses(){
  const r = +S.rate || 0;
  const open = S.expenses.filter(e => !e.paid), paid = S.expenses.filter(e => e.paid);
  const row = e => {
    let sub = money(e.amount), warn = false;
    if (e.due && !e.paid) {
      const d = new Date(e.due + 'T00:00:00'), now = new Date(dayKey() + 'T00:00:00');
      const left = Math.round((d - now) / 864e5);
      if (left > 0) sub += ` · ${d.getDate()} ${MON_S[d.getMonth()]}-მდე · დღეში ${fmtH(e.amount / r / left)}`;
      else if (left === 0) { sub += ' · ვადა დღესაა!'; warn = true; }
      else { sub += ' · ვადა გავიდა'; warn = true; }
    }
    return `<div class="r ${e.paid ? 'paid' : ''}" data-action="exp-edit" data-id="${e.id}">
      <button class="check" data-action="exp-toggle" data-id="${e.id}" aria-label="${e.paid ? 'გადაუხდელია' : 'გადავიხადე'}">✓</button>
      <div class="grow"><div class="t">${esc(e.name)}</div><div class="s ${warn ? 'warn' : ''}">${sub}</div></div>
      <span class="pill num">${r ? fmtH(e.amount / r) : '—'}</span>
    </div>`;
  };
  const sum = open.reduce((a, e) => a + (+e.amount || 0), 0), hrs = r ? sum / r : NaN;
  return `
    ${open.length ? `<div class="rows">${open.map(row).join('')}</div>
      <div class="total"><span class="muted">სულ ${money(sum)}</span><b class="num">${fmtH(hrs)} სამუშაო</b></div>`

    ${paid.length ? `<details><summary>✓ გადახდილი (${paid.length})</summary><div class="rows">${paid.map(row).join('')}</div></details>` : ''}`;
}

function tick(){
  if (tab !== 'home' || !$('#t-clock')) return;
  const L = todayLog();
  const live = S.shift ? (Date.now() - S.shift.start) / 6e4 : 0;
  const min = L.min + live, earn = L.earn + live / 60 * S.rate;
  $('#t-clock').textContent = clock(min);
  $('#t-earn').textContent = money(earn);
  $('#t-net').textContent = money(earn - (+L.fuel || 0));
  const goal = S.goal * 60;
  $('#t-bar').style.width = (goal ? Math.min(100, min / goal * 100) : 0) + '%';
  $('#t-left').textContent = goal ? (min >= goal ? 'მიზანი შესრულდა! 💪' : `დაგრჩა ${fmtH((goal - min) / 60)}`) : '';
  const sb = $('#shift-btn'), want = S.shift ? 'stop' : 'go';
  if (sb.dataset.state !== want) {
    sb.dataset.state = want;
    sb.innerHTML = S.shift ? '<button class="btn stop" data-action="shift">⏸ შეჩერება</button>'

  // დასვენების შეხსენება: 3 საათი შეუსვენებლად

  const rb = $('#rest'), showRest = S.shift && since >= 180;
  if (!!rb.firstChild !== !!showRest) rb.innerHTML = showRest

}
setInterval(tick, 1000);

function addWork(min, when = new Date()){

  L.min += min; L.earn += min / 60 * S.rate;
}
function toggleShift(){
  if (S.shift) {
    const min = (Date.now() - S.shift.start) / 6e4;
    addWork(min, new Date(S.shift.start)); S.shift = null; save(); render();
    toast(`შენახულია: ${fmtH(min / 60)} · ${money(min / 60 * S.rate)}`);
  } else { S.shift = { start: Date.now() }; save(); tick(); toast('ცვლა დაიწყო. გზა მშვიდობისა! 🛵'); }

/* ამინდი (Open-Meteo, უფასო) — წვიმის გაფრთხილება */
let W = null, calcH = '';
async function loadWeather(){
  try {
    const lat = loc.state === 'ok' ? loc.lat : 41.7151, lng = loc.state === 'ok' ? loc.lng : 44.8271;
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lng.toFixed(3)}&current=temperature_2m,precipitation,is_day&hourly=precipitation_probability,precipitation&forecast_days=2&timezone=Asia%2FTbilisi`);
    const d = await r.json(); const now = Date.now();
    let rainAt = null;
    for (let i = 0; i < d.hourly.time.length; i++) {
      const t = new Date(d.hourly.time[i]).getTime();
      if (t < now - 36e5 || t > now + 6 * 36e5) continue;
      if (d.hourly.precipitation_probability[i] >= 50 || d.hourly.precipitation[i] >= 0.3) { rainAt = d.hourly.time[i].slice(11, 16); break; }
    }
    W = { temp: Math.round(d.current.temperature_2m), raining: d.current.precipitation > 0, rainAt, day: d.current.is_day };
  } catch (e) { W = null; }
  renderWeather();
}
function renderWeather(){
  const el = $('#weather'); if (!el) return;
  if (!W) { el.hidden = true; return; }
  const [e, txt] = W.raining ? ['🌧', 'ახლა წვიმს. გზა სველია, ნელა იარე.']
    : W.rainAt ? ['🌦', `წვიმაა მოსალოდნელი ~${W.rainAt}-დან. წვიმის ქურთუკი წაიღე.`]
    : [W.day ? '☀️' : '🌙', 'უახლოეს 6 საათში წვიმა არ არის.'];
  el.innerHTML = `<span class="e">${e}</span><b class="num">${W.temp}°</b><span class="grow muted">${txt}</span>`;
  el.hidden = false;
}

function findLocation(){
  if (!navigator.geolocation) { loc = { state: 'bad' }; if (tab === 'sos') render(); return; }
  loc = { state: 'wait' }; if (tab === 'sos') render();
  const done = () => { if (tab === 'sos') render(); };
  try {
    navigator.geolocation.getCurrentPosition(
      p => { loc = { state: 'ok', lat: p.coords.latitude, lng: p.coords.longitude }; done(); loadWeather(); },
      () => { loc = { state: 'bad' }; done(); },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  } catch (e) { loc = { state: 'bad' }; done(); }
}

  </section>
  <section class="card">
    <div class="head"><h3>სად ვეძებო სამუშაო</h3></div>
    <div class="rows">${JOB_SITES.map(([n, u]) => `
      <a class="r" href="${u}" target="_blank" rel="noopener"><div class="e-ic">🔎</div><div class="grow t">${n}</div><span class="muted">↗</span></a>`).join('')}</div>
  </section>`;
}

/* ============ ფორმები ============ */
function openSheet(html){
  const w = $('#sheet');
  w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  w.hidden = false; w.onclick = e => { if (e.target === w) closeSheet(); };
}
function closeSheet(){ const w = $('#sheet'); w.hidden = true; w.innerHTML = ''; }
function openForm({ title, fields, data = {}, onSave, onDelete, saveLabel = 'შენახვა' }){
  const f = fields.map(x => {
    const v = data[x.key] ?? '';
    let input;
    if (x.type === 'select') input = `<select class="f" id="ff-${x.key}">${x.options.map(([ov, ol]) => `<option value="${ov}" ${String(ov) === String(v) ? 'selected' : ''}>${ol}</option>`).join('')}</select>`;
    else if (x.type === 'textarea') input = `<textarea class="f" id="ff-${x.key}" placeholder="${esc(x.ph || '')}">${esc(v)}</textarea>`;
    else input = `<input class="f" id="ff-${x.key}" type="${x.type || 'text'}" ${x.type === 'number' ? 'inputmode="decimal" step="any" min="0"' : ''} placeholder="${esc(x.ph || '')}" value="${esc(v)}">`;
    return `<div class="field"><label for="ff-${x.key}">${x.label}</label>${input}</div>`;
  }).join('');
  openSheet(`<h3>${title}</h3><form id="sf">${f}
    <div class="btn-row">${onDelete ? '<button type="button" class="btn" id="sf-del" style="flex:0 0 auto;color:var(--red)">წაშლა</button>' : ''}
    <button type="submit" class="btn primary">${saveLabel}</button></div>
    <button type="button" class="btn plain" id="sf-x">გაუქმება</button></form>`);
  $('#sf-x').onclick = closeSheet;
  if (onDelete) $('#sf-del').onclick = () => openConfirm('წავშალო?', () => onDelete());
  $('#sf').onsubmit = e => {
    e.preventDefault();
    const out = {};
    for (const x of fields) {
      const el = $('#ff-' + x.key); let v = el.value.trim();
      if (x.type === 'number' && v !== '') v = Math.max(0, parseFloat(v.replace(',', '.')) || 0);
      if (x.req && (v === '' || v === 0)) { el.focus(); el.style.borderColor = 'var(--red)'; toast('შეავსე: ' + x.label); return; }
      out[x.key] = v;
    }
    onSave(out); closeSheet(); save(); render();
  };
}
function openConfirm(text, onYes){
  openSheet(`<h3>${text}</h3><div class="btn-row"><button class="btn" id="c-no">არა</button><button class="btn red" id="c-yes">კი, წაშალე</button></div>`);
  $('#c-no').onclick = closeSheet;
  $('#c-yes').onclick = () => { onYes(); closeSheet(); save(); render(); };
}
const EXP_FIELDS = [
  { key: 'name', label: 'რა არის?', ph: 'მაგ. ქირა, ბანკი, ვალი', req: true },
  { key: 'amount', label: 'თანხა (₾)', type: 'number', ph: '0', req: true },
  { key: 'due', label: 'როდემდე? (თუ გინდა)', type: 'date' },
];
const DISC_FIELDS = [
  { key: 'name', label: 'სად?', ph: 'ადგილის სახელი', req: true },
  { key: 'cat', label: 'რა ტიპის?', type: 'select', options: Object.entries(CATS).map(([k, [i, l]]) => [k, `${i} ${l}`]) },
  { key: 'pct', label: 'რამდენი %? (თუ არ იცი, დატოვე)', type: 'number', ph: '10' },
  { key: 'addr', label: 'მისამართი', ph: 'ქუჩა, უბანი' },
  { key: 'note', label: 'როგორ მივიღო?', type: 'textarea', ph: 'მაგ. აჩვენე კურიერის აპი' },
];
const JOB_FIELDS = [
  { key: 'type', label: 'ტიპი', type: 'select', options: [['once', '⚡ ერთჯერადი საქმე'], ['vac', '💼 ვაკანსია']] },
  { key: 'title', label: 'რა საქმეა?', ph: 'მაგ. ამანათის მიტანა', req: true },
  { key: 'pay', label: 'ანაზღაურება', ph: 'მაგ. 40 ₾', req: true },
  { key: 'place', label: 'სად?', ph: 'უბანი' },
  { key: 'time', label: 'როდის?', ph: 'მაგ. დღეს 18:00-მდე' },
  { key: 'phone', label: 'ტელეფონი', type: 'tel', ph: '5XX XX XX XX' },
];
const CONTACT_FIELDS = [
  { key: 'name', label: 'სახელი', ph: 'მაგ. გიორგი', req: true },
  { key: 'phone', label: 'ტელეფონი', type: 'tel', ph: '5XX XX XX XX', req: true },
];
function openSettings(){
  openSheet(`<h3>პარამეტრები</h3>
    <div class="field"><label for="st-name">ჩემი სახელი (SOS-ში ჩაიწერება)</label><input class="f" id="st-name" value="${esc(S.name)}" placeholder="მაგ. ლევანი"></div>
    <div class="field"><label for="st-goal">დღის მიზანი (საათი)</label><input class="f" id="st-goal" type="number" inputmode="decimal" min="1" max="24" value="${S.goal}"></div>
    <div class="field"><label>ფონი</label><div class="switch">
      <button data-theme-set="dark" class="${S.theme === 'dark' ? 'on' : ''}">🌙 მუქი</button>
      <button data-theme-set="light" class="${S.theme === 'light' ? 'on' : ''}">☀️ ნათელი</button></div></div>
    <div class="btn-row"><button class="btn primary" id="st-save">შენახვა</button></div>
    <button class="btn plain" style="color:var(--red)" id="st-reset">ყველაფრის წაშლა</button>`);
  document.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => {
    S.theme = b.dataset.themeSet; applyTheme(); save();
    document.querySelectorAll('[data-theme-set]').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#st-save').onclick = () => {
    S.name = $('#st-name').value.trim();
    const g = parseFloat($('#st-goal').value); if (g > 0 && g <= 24) S.goal = g;
    save(); closeSheet(); render(); toast('შენახულია');
  };
  $('#st-reset').onclick = () => openConfirm('წავშალო ყველა ჩანაწერი?', () => {
    const theme = S.theme; S = DEFAULT(); S.theme = theme; S.expenses = []; toast('წაიშალა');
  });
}
function applyTheme(){
  document.documentElement.dataset.theme = S.theme;
  $('meta[name=theme-color]').content = S.theme === 'light' ? '#F3F4F6' : '#0E1014';
}

/* ============ ღილაკები ============ */
document.addEventListener('click', e => {
  const tb = e.target.closest('.tab'); if (tb) { go(tb.dataset.tab); return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action, id = el.dataset.id, find = arr => arr.find(x => x.id === id);
  switch (a) {
    case 'open-settings': openSettings(); break;
    case 'rate-dec': setRate(Math.max(0, (+S.rate || 0) - 1)); $('#rate').value = S.rate; break;
    case 'rate-inc': setRate((+S.rate || 0) + 1); $('#rate').value = S.rate; break;
    case 'shift': toggleShift(); break;
    case 'rest-ok': if (S.shift) { S.shift.rest = Date.now(); save(); tick(); } break;
    case 'add-time': openForm({ title: 'ნამუშევარი საათების ჩაწერა', saveLabel: 'დამატება',
        fields: [{ key: 'h', label: 'საათი', type: 'number', ph: '0' }, { key: 'm', label: 'წუთი', type: 'number', ph: '0' }],
        onSave: v => { const min = (+v.h || 0) * 60 + (+v.m || 0); if (min > 0) { addWork(min); toast(`დაემატა ${fmtH(min / 60)}`); } } }); break;
    case 'edit-goal': openForm({ title: 'დღის მიზანი', data: { goal: S.goal }, fields: [{ key: 'goal', label: 'დღეში რამდენი საათი?', type: 'number', req: true }],
        onSave: v => { if (v.goal > 0 && v.goal <= 24) S.goal = v.goal; } }); break;
    case 'exp-add': openForm({ title: 'ახალი ვალი / ხარჯი', fields: EXP_FIELDS, saveLabel: 'დამატება',
        onSave: v => S.expenses.push({ id: uid(), paid: false, ...v }) }); break;
    case 'exp-edit': { const x = find(S.expenses); if (!x) break; openForm({ title: 'შეცვლა', fields: EXP_FIELDS, data: x,
        onSave: v => Object.assign(x, v), onDelete: () => { S.expenses = S.expenses.filter(y => y !== x); } }); break; }
    case 'exp-toggle': { const x = find(S.expenses); if (!x) break; x.paid = !x.paid; save(); $('#exp-box').innerHTML = viewExpenses();
        if (x.paid) toast(`✓ ${x.name} — გადახდილია!`); break; }
    case 'disc-cat': discCat = el.dataset.v; render(); break;
    case 'disc-add': openForm({ title: 'ახალი ფასდაკლება', fields: DISC_FIELDS, saveLabel: 'დამატება', data: { cat: discCat === 'all' ? 'food' : discCat },
        onSave: v => S.discounts.unshift({ id: uid(), ...v }) }); break;
    case 'disc-edit': { const x = find(S.discounts); if (!x) break; openForm({ title: 'ფასდაკლება', fields: DISC_FIELDS, data: x,
        onSave: v => Object.assign(x, v), onDelete: () => { S.discounts = S.discounts.filter(y => y !== x); } }); break; }
    case 'sos-prob': sosProb = sosProb === el.dataset.v ? null : el.dataset.v; render(); break;
    case 'sos-loc': findLocation(); break;
    case 'sos-sms': if (!S.contacts.length) { e.preventDefault(); toast('ჯერ დაამატე კურიერები'); } else toast('იხსნება SMS…'); break;
    case 'contact-add': openForm({ title: 'კურიერის დამატება', fields: CONTACT_FIELDS, saveLabel: 'დამატება',
        onSave: v => S.contacts.push({ id: uid(), ...v }) }); break;
    case 'contact-edit': { if (e.target.closest('.call')) break; const x = find(S.contacts); if (!x) break; openForm({ title: 'კურიერი', fields: CONTACT_FIELDS, data: x,
        onSave: v => Object.assign(x, v), onDelete: () => { S.contacts = S.contacts.filter(y => y !== x); } }); break; }
    case 'phrase-next': S.phraseShift++; save(); render(); break;
    case 'phrase-copy': { const p = phrase(), txt = `„${p.t}“ — ${p.a}`;
        try { navigator.clipboard.writeText(txt).then(() => toast('დაკოპირდა ✓'), () => toast('ვერ დაკოპირდა')); } catch (err) { toast('ვერ დაკოპირდა'); } break; }
    case 'open-work': openWork(id); break;
    case 'close-reader': closeReader(); break;
    case 'font-inc': S.font = Math.min(30, S.font + 2); $('#r-inner').style.fontSize = S.font + 'px'; save(); break;
    case 'font-dec': S.font = Math.max(14, S.font - 2); $('#r-inner').style.fontSize = S.font + 'px'; save(); break;
    case 'job-type': jobType = el.dataset.v; render(); break;
    case 'job-add': openForm({ title: 'ახალი განცხადება', fields: JOB_FIELDS, saveLabel: 'დამატება', data: { type: jobType },
        onSave: v => { S.jobs.unshift({ id: uid(), ...v }); jobType = v.type; } }); break;
    case 'job-edit': { if (e.target.closest('.call')) break; const x = find(S.jobs); if (!x) break; openForm({ title: 'განცხადება', fields: JOB_FIELDS, data: x,
        onSave: v => { Object.assign(x, v); jobType = v.type; }, onDelete: () => { S.jobs = S.jobs.filter(y => y !== x); } }); break; }
  }
});
function setRate(v){
  S.rate = v; save();
  if ($('#exp-box')) $('#exp-box').innerHTML = viewExpenses();
  updateCalc(); tick();
}
function updateCalc(){
  const h = $('#c-h'); if (!h) return;
  $('#c-h-r').textContent = money(parseFloat(h.value || h.placeholder) * (+S.rate || 0));
}
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'rate') { const v = parseFloat(e.target.value.replace(',', '.')); if (v >= 0) setRate(v); }
  if (id === 'c-h') { calcH = e.target.value; updateCalc(); }
  if (id === 'fuel') { todayLog().fuel = Math.max(0, parseFloat(e.target.value) || 0); save(); tick(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (!$('#reader').hidden) closeReader(); }
});

(function start(){
  const d = new Date();
  $('#today-label').textContent = `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  applyTheme(); go(tab); loadWeather(); setInterval(loadWeather, 30 * 6e4);
})();
</script>
