<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<title>კურიერის ჯიბე</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1014; --card:#171A21; --card2:#1F232C; --line:#2A2F3A;
  --text:#F2F4F7; --muted:#9AA3B2; --accent:#FFB020; --accent-ink:#1A1206;
  --green:#2BD47D; --red:#FF4D4F; --blue:#4DA3FF;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --r:18px;
}
html[data-theme="light"]{
  --bg:#F4F5F7; --card:#FFFFFF; --card2:#F0F2F5; --line:#E2E5EA;
  --text:#14161A; --muted:#5F6878; --accent:#F59E0B; --accent-ink:#1A1206;
  --green:#16A34A; --red:#E5383B; --blue:#2563EB;
  --shadow:0 6px 18px rgba(20,22,26,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px;border-radius:10px}
.brand b{display:block;font-size:17px;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:13px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}

main{padding:4px 16px calc(110px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h2.page{font-size:22px;margin:6px 2px 4px;font-weight:800}
p.lead{margin:0 2px 14px;color:var(--muted);font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h h3{margin:0;font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}

/* rate */
.rate{display:flex;align-items:center;gap:10px}
.rate .lbl{flex:1;font-weight:600}
.stepper{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stepper button{width:42px;height:56px;border:0;background:transparent;font-size:24px;font-weight:600;color:var(--muted)}
.stepper input{width:58px;height:56px;border:0;background:transparent;text-align:center;font-size:26px;font-weight:800;outline:none}
.stepper .cur{padding-right:12px;font-weight:700;color:var(--muted)}

/* today */
.today-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.stat{background:var(--card2);border-radius:14px;padding:12px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:800;margin-top:2px}
.stat .v.green{color:var(--green)}
.bar{height:12px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#FFD166);border-radius:99px;transition:width .4s}
.bar-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.fuel{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.fuel input.f{width:96px;flex:none;text-align:center;font-weight:700}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;border:0;
  font-weight:700;font-size:16px;text-decoration:none;background:var(--card2);color:var(--text);padding:0 16px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--green);color:#04210F}
.btn.stop{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted);min-height:48px}
.btn.outline{background:transparent;border:2px solid var(--red);color:var(--red)}
.btn.danger{background:var(--red);color:#fff}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.link-btn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;font-size:14px}

input.f,select.f,textarea.f{width:100%;height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:17px;outline:none}
textarea.f{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--accent)}

/* expenses */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid transparent}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:13px;color:var(--muted);margin-top:1px}
.item .sub.warn{color:var(--red)}
.check{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;font-weight:800}
.item.paid{opacity:.55}
.item.paid .check{background:var(--green);border-color:var(--green);color:#04210F}
.item.paid .t{text-decoration:line-through}
.hours{flex:none;font-weight:800;font-size:15px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);padding:7px 10px;border-radius:10px;white-space:nowrap}
html[data-theme="light"] .hours{color:#9A5B00}
.total{margin-top:12px;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--card2))}
.total .big{font-size:20px;font-weight:800}
.hint{font-size:13px;color:var(--muted);background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:10px}
details.paid-box{margin-top:10px}
details.paid-box summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 2px;list-style:none}
details.paid-box summary::-webkit-details-marker{display:none}
details.paid-box .list{margin-top:6px}

/* calc */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc .box{background:var(--card2);border-radius:14px;padding:12px}
.calc label{font-size:13px;color:var(--muted)}
.calc input{width:100%;border:0;background:transparent;font-size:24px;font-weight:800;outline:none;padding:2px 0}
.calc .res{font-size:14px;font-weight:600;color:var(--accent)}

/* week */
.week{display:flex;align-items:flex-end;gap:8px;height:120px;margin:6px 0 8px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.week .col{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--card2);position:relative;min-height:4px}
.week .col.has{background:var(--accent)}
.week .col.today{outline:2px solid var(--accent);outline-offset:2px}
.week .h{font-size:11px;color:var(--muted)}
.week .l{font-size:12px;color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{height:46px;border:0;border-radius:12px;background:transparent;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text)}

/* discount / job cards */
.disc{display:flex;gap:12px;align-items:center;cursor:pointer}
.ic{width:48px;height:48px;flex:none;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:24px}
.pct{flex:none;min-width:64px;text-align:center;font-weight:800;font-size:20px;padding:10px 8px;border-radius:14px;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pct.unk{background:var(--card2);color:var(--muted);font-size:13px;font-weight:700;line-height:1.2}
.ttl{font-weight:700;font-size:16px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted);vertical-align:middle;margin-left:4px}
.tag.warn{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin-top:4px}
.job .pay{font-weight:800;color:var(--green);font-size:17px}
.job .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);margin:6px 0 10px}
.empty{text-align:center;color:var(--muted);padding:26px 12px}
.empty .e{font-size:38px}

/* SOS */
.sos-hero{background:radial-gradient(120% 120% at 50% 0%,color-mix(in srgb,var(--red) 30%,var(--card)) 0%,var(--card) 70%);border:1px solid color-mix(in srgb,var(--red) 40%,var(--line));border-radius:24px;padding:20px 16px;text-align:center;margin-bottom:12px}
.sos-ring{width:96px;height:96px;margin:0 auto 10px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 0 0 10px color-mix(in srgb,var(--red) 22%,transparent),0 0 0 22px color-mix(in srgb,var(--red) 10%,transparent)}
.sos-hero h2{margin:8px 0 2px;font-size:21px}
.probs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prob{min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:600;display:flex;align-items:center;gap:8px;padding:0 12px;text-align:left}
.prob .e{font-size:22px}
.prob.on{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 14%,var(--card2))}
.loc{display:flex;align-items:center;gap:12px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--green);box-shadow:0 0 0 6px color-mix(in srgb,var(--green) 20%,transparent)}
.dot.bad{background:var(--red)}
.call{width:52px;height:52px;flex:none;border-radius:16px;background:var(--green);color:#04210F;display:grid;place-items:center;text-decoration:none}
.call svg{width:24px;height:24px}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--accent)}
.alert{border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--red) 14%,var(--card2));color:var(--text);font-size:14px;margin-top:10px}
.soon{display:flex;gap:12px;align-items:center;border-style:dashed}

/* books */
.quote{background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 22%,var(--card)) 0%,var(--card) 65%)}
.quote .q{font-size:20px;line-height:1.5;font-weight:600;margin:4px 0 10px}
.quote .a{color:var(--muted);font-size:14px}
.work{display:flex;gap:12px;align-items:center;cursor:pointer}
.work .ic{font-size:22px;font-weight:800;color:var(--accent)}
.src{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.src a{color:var(--muted)}

/* reader */
#reader{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.r-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.r-top .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-body{flex:1;overflow-y:auto;padding:20px 20px calc(40px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.r-inner{max-width:620px;margin:0 auto}
.r-inner h1{font-size:1.5em;margin:0 0 2px}
.r-inner .by{color:var(--muted);margin-bottom:22px}
.stanza{margin:0 0 1.2em;line-height:1.7}
.r-inner h3{margin:1.6em 0 .6em;color:var(--accent);text-align:center}
.r-inner p{margin:0 0 1em;line-height:1.75}
.r-end{text-align:center;color:var(--muted);margin-top:28px;font-size:14px}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11.5px;font-weight:600;min-height:58px;justify-content:center}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab.sos{position:relative}
.tab.sos .sosb{width:62px;height:62px;margin-top:-30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;
  border:5px solid var(--bg);box-shadow:0 6px 18px color-mix(in srgb,var(--red) 45%,transparent)}
.tab.sos.on{color:var(--red)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 14px;font-size:19px}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px 2px;font-weight:600}
.sheet .btn-row{margin-top:6px}
.switch{display:flex;background:var(--card2);border-radius:14px;padding:4px}
.switch button{flex:1;height:44px;border:0;border-radius:11px;background:transparent;font-weight:700;color:var(--muted)}
.switch button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:99;
  background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <img src="icon.svg" alt="">
    <div><b>კურიერის ჯიბე</b><small id="today-label"></small></div>
  </div>
  <button class="icon-btn" data-action="open-settings" aria-label="პარამეტრები">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
  </button>
</header>

<main id="app"></main>

<nav class="tabs" aria-label="მენიუ">
  <button class="tab" data-tab="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    მთავარი
  </button>
  <button class="tab" data-tab="discounts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.6" fill="currentColor"/></svg>
    ფასდაკლება
  </button>
  <button class="tab sos" data-tab="sos"><span class="sosb">SOS</span>დახმარება</button>
  <button class="tab" data-tab="books">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg>
    წიგნები
  </button>
  <button class="tab" data-tab="jobs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>
    სამუშაო
  </button>
</nav>

<div id="sheet" class="sheet-wrap" hidden></div>
<div id="reader" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ დამხმარეები ============ */
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['იანვარი','თებერვალი','მარტი','აპრილი','მაისი','ივნისი','ივლისი','აგვისტო','სექტემბერი','ოქტომბერი','ნოემბერი','დეკემბერი'];
const MON_S = ['იან','თებ','მარ','აპრ','მაი','ივნ','ივლ','აგვ','სექ','ოქტ','ნოე','დეკ'];
const DAYS = ['კვირა','ორშაბათი','სამშაბათი','ოთხშაბათი','ხუთშაბათი','პარასკევი','შაბათი'];
const DAY_S = ['კვი','ორშ','სამ','ოთხ','ხუთ','პარ','შაბ'];
const pad = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const money = x => { const v = Math.round((+x || 0) * 100) / 100; return (Number.isInteger(v) ? v : v.toFixed(2)) + ' ₾'; };
function fmtH(hours){
  if (!isFinite(hours) || hours < 0) return '—';
  let m = Math.round(hours * 60); const h = Math.floor(m / 60); m %= 60;
  if (h && m) return `${h} სთ ${m} წთ`;
  if (h) return `${h} სთ`;
  return `${m} წთ`;
}
function clock(min){
  const s = Math.floor(min * 60); return `${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
const ICON_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>';

/* ============ მონაცემები (ტელეფონში ინახება) ============ */
const KEY = 'kurieris-jibe-v1';
const DEFAULT = () => ({
  rate: 15, goal: 8, name: '', theme: 'dark', font: 19,
  expenses: [
    { id: uid(), name: 'ნიკას ვალი', amount: 100, due: '', paid: false, sample: true },
    { id: uid(), name: 'ბანკი', amount: 300, due: '', paid: false, sample: true },

let S;

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const todayLog = () => (S.log[dayKey()] ||= { min: 0, earn: 0, fuel: 0 });

/* ============ ნავიგაცია ============ */
const TABS = ['home', 'discounts', 'sos', 'books', 'jobs'];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
function go(t){
  tab = t;
  if (location.hash.slice(1) !== t) { try { history.replaceState(null, '', '#' + t); } catch (e) { location.hash = t; } }
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  render(); window.scrollTo(0, 0);
  if (t === 'sos') findLocation();
}
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.includes(t) && t !== tab) go(t); });

function render(){
  const app = $('#app');
  if (tab === 'home') app.innerHTML = viewHome();
  if (tab === 'discounts') app.innerHTML = viewDiscounts();
  if (tab === 'sos') app.innerHTML = viewSos();
  if (tab === 'books') app.innerHTML = viewBooks();
  if (tab === 'jobs') app.innerHTML = viewJobs();
  if (tab === 'home') tick();
}

function viewExpenses(){
  const r = +S.rate || 0;
  const open = S.expenses.filter(e => !e.paid), paid = S.expenses.filter(e => e.paid);
  const row = e => {
    let sub = money(e.amount), warn = false;
    if (e.due && !e.paid) {
      const d = new Date(e.due + 'T00:00:00'), now = new Date(dayKey() + 'T00:00:00');
      const left = Math.round((d - now) / 864e5);
      sub += ` · ${d.getDate()} ${MON_S[d.getMonth()]}`;
      if (left > 0) sub += ` · ${left} დღე დარჩა · დღეში ${fmtH(e.amount / r / left)}`;
      else if (left === 0) { sub += ' · დღესაა!'; warn = true; }
      else { sub += ' · ვადა გავიდა'; warn = true; }
    }
    return `<div class="item ${e.paid ? 'paid' : ''}" data-action="exp-edit" data-id="${e.id}">
      <button class="check" data-action="exp-toggle" data-id="${e.id}" aria-label="${e.paid ? 'გადაუხდელად მონიშვნა' : 'გადახდილად მონიშვნა'}">✓</button>
      <div class="grow"><div class="t">${esc(e.name)}</div><div class="sub ${warn ? 'warn' : ''}">${sub}</div></div>
      <div class="hours num">${r ? fmtH(e.amount / r) : '—'}</div>
    </div>`;
  };
  const sum = open.reduce((a, e) => a + (+e.amount || 0), 0);
  const hrs = r ? sum / r : NaN;
  return `
    ${S.expenses.some(e => e.sample) ? '<div class="hint">ეს ნიმუშია. შეეხე და შეცვალე, ან წაშალე.</div>' : ''}
    ${open.length ? `<div class="list">${open.map(row).join('')}</div>` :
      `<div class="empty"><div class="e">🎉</div>ყველაფერი გადახდილია!</div>`}
    ${open.length ? `<div class="total">
      <div class="muted small">სულ დარჩა გადასახდელი</div>
      <div class="big num">${money(sum)} = ${fmtH(hrs)}</div>
      <div class="muted small">≈ ${r && S.goal ? Math.ceil(hrs / S.goal) : '—'} სამუშაო დღე (დღეში ${S.goal} სთ)</div>
    </div>` : ''}
    ${paid.length ? `<details class="paid-box"><summary>✓ გადახდილი (${paid.length}) ▾</summary><div class="list">${paid.map(row).join('')}</div></details>` : ''}`;
}

function viewWeek(){
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const data = days.map(d => {
    const L = S.log[dayKey(d)] || { min: 0, earn: 0 };
    let min = L.min, earn = L.earn;
    if (i_isToday(d) && S.shift) { const live = (Date.now() - S.shift.start) / 6e4; min += live; earn += live / 60 * S.rate; }
    return { d, min, earn };
  });
  const max = Math.max(S.goal * 60, ...data.map(x => x.min)) || 1;
  const totMin = data.reduce((a, x) => a + x.min, 0), totEarn = data.reduce((a, x) => a + x.earn, 0);
  return `<div class="week">${data.map(x => `
      <div class="d"><span class="h num">${x.min >= 1 ? (Math.round(x.min / 6) / 10) : ''}</span>
        <div class="col ${x.min >= 1 ? 'has' : ''} ${i_isToday(x.d) ? 'today' : ''}" style="height:${Math.max(4, x.min / max * 100)}%"></div>
        <span class="l">${DAY_S[x.d.getDay()]}</span></div>`).join('')}
    </div>
    <div class="row"><div class="grow muted small">სულ 7 დღეში</div><b class="num">${fmtH(totMin / 60)} · ${money(totEarn)}</b></div>`;
}
function i_isToday(d){ return dayKey(d) === dayKey(); }

function tick(){
  if (tab !== 'home' || !$('#t-clock')) return;
  const L = todayLog();
  const live = S.shift ? (Date.now() - S.shift.start) / 6e4 : 0;
  const min = L.min + live, earn = L.earn + live / 60 * S.rate;
  $('#t-clock').textContent = clock(min);
  $('#t-earn').textContent = money(earn);
  $('#t-net').textContent = money(earn - (+L.fuel || 0));
  const goal = S.goal * 60, pct = goal ? Math.min(100, min / goal * 100) : 0;
  $('#t-bar').style.width = pct + '%';
  $('#t-left').textContent = goal ? (min >= goal ? 'მიზანი შესრულდა! 💪' : `დაგრჩა ${fmtH((goal - min) / 60)}`) : '';
  const sb = $('#shift-btn');
  const want = S.shift ? 'stop' : 'go';
  if (sb.dataset.state !== want) {
    sb.dataset.state = want;
    sb.innerHTML = S.shift
      ? '<button class="btn stop" data-action="shift">⏸ ცვლის შეჩერება</button>'
      : '<button class="btn go" data-action="shift">▶ ცვლის დაწყება</button>';
  }
}
setInterval(tick, 1000);

function addWork(min, when = new Date()){
  const k = dayKey(when); const L = (S.log[k] ||= { min: 0, earn: 0, fuel: 0 });
  L.min += min; L.earn += min / 60 * S.rate;
}
function toggleShift(){
  if (S.shift) {
    const min = (Date.now() - S.shift.start) / 6e4;
    addWork(min, new Date(S.shift.start));
    S.shift = null; save(); render();
    toast(`შენახულია: ${fmtH(min / 60)} · ${money(min / 60 * S.rate)}`);
  } else {
    S.shift = { start: Date.now() }; save(); tick(); toast('ცვლა დაიწყო. წარმატებები! 🛵');
  }
}

function findLocation(){
  if (!navigator.geolocation) { loc = { state: 'bad' }; if (tab === 'sos') render(); return; }
  loc = { state: 'wait' }; if (tab === 'sos') render();
  try {
    navigator.geolocation.getCurrentPosition(
      p => { loc = { state: 'ok', lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; if (tab === 'sos') render(); },
      () => { loc = { state: 'bad' }; if (tab === 'sos') render(); },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  } catch (e) { loc = { state: 'bad' }; if (tab === 'sos') render(); }
}

let BOOKS = null;
fetch('books.json').then(r => r.json()).then(d => { BOOKS = d; if (tab === 'books') render(); }).catch(() => { BOOKS = { works: [], phrases: [] }; if (tab === 'books') render(); });
function dayOfYear(){ const n = new Date(); return Math.floor((n - new Date(n.getFullYear(), 0, 0)) / 864e5); }
function phrase(){
  const P = BOOKS.phrases; return P[(dayOfYear() + S.phraseShift) % P.length];
}
function workMinutes(w){
  const txt = w.k === 'poem' ? w.s.flat().join(' ') : w.c.map(c => c.p.join(' ')).join(' ');
  return Math.max(1, Math.round(txt.split(/\s+/).length / 160));
}

  if (!BOOKS) return '<div class="empty"><div class="e">📖</div>იტვირთება…</div>';
  const ph = BOOKS.phrases.length ? phrase() : null;
  const last = BOOKS.works.find(w => w.id === S.last);
  return `
  ${ph ? `<div class="card quote">
    <div class="muted small" style="font-weight:700">✨ დღის ფრაზა</div>
    <div class="q">„${esc(ph.t)}“</div>
    <div class="a">— ${esc(ph.a)}</div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn" style="min-height:46px" data-action="phrase-next">↻ სხვა ფრაზა</button>
      <button class="btn" style="min-height:46px" data-action="phrase-copy">⧉ კოპირება</button>
    </div>
  </div>` : ''}
  ${last ? `<div class="card work" data-action="open-work" data-id="${last.id}" style="border-color:var(--accent)">
      <div class="ic">▶</div><div class="grow"><div class="muted small">გააგრძელე კითხვა</div><div class="ttl">${esc(last.t)}</div></div></div>` : ''}
  <h2 class="page" style="margin-top:14px">ქართული ლიტერატურა</h2>
  <p class="lead">მოკლე ლექსები და მოთხრობა — შეკვეთებს შორის წასაკითხად.</p>
  ${BOOKS.works.map(w => `
    <div class="card work" data-action="open-work" data-id="${w.id}">
      <div class="ic">${esc(w.a.charAt(0))}</div>
      <div class="grow"><div class="ttl">${esc(w.t)}</div><div class="muted small">${esc(w.a)} · ${w.k === 'poem' ? 'ლექსი' : 'მოთხრობა'} · ${workMinutes(w)} წთ</div></div>
      <span class="muted">›</span>
    </div>`).join('')}
  <div class="src">ტექსტები: <a href="https://ka.wikisource.org" target="_blank" rel="noopener">ვიკიწყარო</a></div>`;
}
let readerWork = null;
function openWork(id){
  const w = BOOKS.works.find(x => x.id === id); if (!w) return;
  readerWork = w; S.last = id; save();
  const R = $('#reader');
  const body = w.k === 'poem'
    ? w.s.map(st => `<div class="stanza">${st.map(esc).join('<br>')}</div>`).join('')
    : w.c.map(c => `<h3>${esc(c.t)}</h3>${c.p.map(p => `<p>${esc(p)}</p>`).join('')}`).join('');
  R.innerHTML = `
    <div class="r-top">
      <button class="icon-btn" data-action="close-reader" aria-label="უკან">←</button>
      <div class="ttl">${esc(w.t)}</div>
      <button class="icon-btn" data-action="font-dec" aria-label="ასოს დაპატარავება">A−</button>
      <button class="icon-btn" data-action="font-inc" aria-label="ასოს გადიდება">A+</button>
    </div>
    <div class="r-body" id="r-body"><div class="r-inner" id="r-inner" style="font-size:${S.font}px">
      <h1>${esc(w.t)}</h1><div class="by">${esc(w.a)}${w.y ? ' · ' + esc(w.y) : ''}</div>
      ${body}
      <div class="r-end">— დასასრული —</div>
    </div></div>`;
  R.hidden = false; document.body.style.overflow = 'hidden';
  const rb = $('#r-body');
  requestAnimationFrame(() => { rb.scrollTop = (S.read[id] || 0) * (rb.scrollHeight - rb.clientHeight); });
  let t; rb.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(() => {
    const max = rb.scrollHeight - rb.clientHeight; S.read[id] = max > 0 ? rb.scrollTop / max : 0; save(); }, 300); });
}
function closeReader(){ $('#reader').hidden = true; document.body.style.overflow = ''; readerWork = null; if (tab === 'books') render(); }

/* ============ 5. სამუშაო ============ */
let jobType = 'vac';
function viewJobs(){
  const list = S.jobs.filter(j => j.type === jobType);
  return `
  <h2 class="page">სამუშაო</h2>
  <p class="lead">ვაკანსიები და ერთჯერადი საქმეები კურიერებისთვის.</p>
  <div class="seg">
    <button class="${jobType === 'vac' ? 'on' : ''}" data-action="job-type" data-v="vac">💼 ვაკანსიები</button>
    <button class="${jobType === 'once' ? 'on' : ''}" data-action="job-type" data-v="once">⚡ ერთჯერადი</button>
  </div>
  ${list.length ? list.map(j => `
    <div class="card job" data-action="job-edit" data-id="${j.id}">
      <div class="row"><div class="grow ttl">${esc(j.title)}${j.sample ? '<span class="tag">ნიმუში</span>' : ''}</div><div class="pay">${esc(j.pay)}</div></div>

  <button class="btn primary" data-action="job-add">+ განცხადების დამატება</button>
  <p class="muted small" style="text-align:center;margin-top:10px">მეორე ეტაპზე განცხადებებს ყველა კურიერი ერთად დაინახავს.</p>`;
}

/* ============ ფორმები (ქვედა ფანჯარა) ============ */
function openSheet(html){
  const w = $('#sheet');
  w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  w.hidden = false;
  w.onclick = e => { if (e.target === w) closeSheet(); };
}
function closeSheet(){ const w = $('#sheet'); w.hidden = true; w.innerHTML = ''; }
function openForm({ title, fields, data = {}, onSave, onDelete, saveLabel = 'შენახვა' }){
  const f = fields.map(x => {
    const v = data[x.key] ?? x.value ?? '';
    let input;
    if (x.type === 'select') input = `<select class="f" name="${x.key}" id="ff-${x.key}">${x.options.map(([ov, ol]) => `<option value="${ov}" ${String(ov) === String(v) ? 'selected' : ''}>${ol}</option>`).join('')}</select>`;
    else if (x.type === 'textarea') input = `<textarea class="f" name="${x.key}" id="ff-${x.key}" placeholder="${esc(x.ph || '')}">${esc(v)}</textarea>`;
    else input = `<input class="f ${x.type === 'number' || x.type === 'tel' ? 'num' : ''}" name="${x.key}" id="ff-${x.key}" type="${x.type || 'text'}" ${x.type === 'number' ? 'inputmode="decimal" step="any" min="0"' : ''} placeholder="${esc(x.ph || '')}" value="${esc(v)}">`;
    return `<div class="field"><label for="ff-${x.key}">${x.label}${x.optional ? ' <span style="font-weight:400">(არასავალდებულო)</span>' : ''}</label>${input}${x.help ? `<div class="muted small" style="margin:6px 2px 0">${x.help}</div>` : ''}</div>`;
  }).join('');
  openSheet(`<h3>${title}</h3><form id="sf">${f}
    <div class="btn-row">${onDelete ? '<button type="button" class="btn" id="sf-del" style="flex:0 0 auto;color:var(--red)">წაშლა</button>' : ''}
    <button type="submit" class="btn primary">${saveLabel}</button></div>
    <button type="button" class="btn ghost" style="margin-top:8px;border:0" id="sf-x">გაუქმება</button></form>`);
  $('#sf-x').onclick = closeSheet;
  if (onDelete) $('#sf-del').onclick = () => openConfirm('ნამდვილად წავშალო?', 'კი, წაშალე', () => { onDelete(); });
  $('#sf').onsubmit = e => {
    e.preventDefault();
    const out = {};
    for (const x of fields) {
      let v = $('#ff-' + x.key).value.trim();
      if (x.type === 'number' && v !== '') v = Math.max(0, parseFloat(v.replace(',', '.')) || 0);
      if (!x.optional && (v === '' || v === 0 && x.positive)) { const el = $('#ff-' + x.key); el.focus(); el.style.borderColor = 'var(--red)'; toast('შეავსე: ' + x.label); return; }
      out[x.key] = v;
    }
    onSave(out); closeSheet(); save(); render();
  };
  setTimeout(() => { const first = $('#sf .f'); if (first && !data[fields[0].key]) first.focus(); }, 250);
}
function openConfirm(text, yes, onYes){
  openSheet(`<h3>${text}</h3><div class="btn-row"><button class="btn" id="c-no">არა</button><button class="btn danger" id="c-yes">${yes}</button></div>`);
  $('#c-no').onclick = closeSheet;
  $('#c-yes').onclick = () => { onYes(); closeSheet(); save(); render(); };
}

const EXP_FIELDS = [
  { key: 'name', label: 'რა არის?', ph: 'მაგ. ქირა, ბანკი, ვალი' },
  { key: 'amount', label: 'თანხა (₾)', type: 'number', ph: '0', positive: true },
  { key: 'due', label: 'როდემდე უნდა გადავიხადო?', type: 'date', optional: true, help: 'თუ თარიღს ჩაწერ, გეტყვის დღეში რამდენი საათი იმუშაო.' },
];
const DISC_FIELDS = [
  { key: 'name', label: 'ადგილის სახელი', ph: 'მაგ. შაურმის ბარი' },
  { key: 'cat', label: 'კატეგორია', type: 'select', options: Object.entries(CATS).map(([k, [i, l]]) => [k, `${i} ${l}`]) },
  { key: 'pct', label: 'ფასდაკლება (%)', type: 'number', optional: true, ph: 'თუ არ იცი, დატოვე ცარიელი' },
  { key: 'addr', label: 'მისამართი', optional: true, ph: 'ქუჩა, უბანი' },
  { key: 'note', label: 'შენიშვნა', type: 'textarea', optional: true, ph: 'მაგ. მოითხოვე კურიერის ბარათი' },
];
const JOB_FIELDS = [
  { key: 'type', label: 'ტიპი', type: 'select', options: [['vac', '💼 ვაკანსია'], ['once', '⚡ ერთჯერადი საქმე']] },
  { key: 'title', label: 'რა სამუშაოა?', ph: 'მაგ. ამანათის მიტანა' },
  { key: 'pay', label: 'ანაზღაურება', ph: 'მაგ. 40 ₾' },
  { key: 'place', label: 'სად?', optional: true, ph: 'უბანი, ქალაქი' },
  { key: 'time', label: 'როდის?', optional: true, ph: 'მაგ. დღეს, 18:00-მდე' },
  { key: 'phone', label: 'ტელეფონი', type: 'tel', optional: true, ph: '5XX XX XX XX' },
  { key: 'note', label: 'დამატებით', type: 'textarea', optional: true },
];
const CONTACT_FIELDS = [
  { key: 'name', label: 'სახელი', ph: 'მაგ. გიორგი' },
  { key: 'phone', label: 'ტელეფონი', type: 'tel', ph: '5XX XX XX XX' },
];
function openSettings(){
  openSheet(`<h3>პარამეტრები</h3>
    <div class="field"><label for="st-name">ჩემი სახელი <span style="font-weight:400">(SOS შეტყობინებაში ჩაიწერება)</span></label><input class="f" id="st-name" value="${esc(S.name)}" placeholder="მაგ. ლევანი"></div>
    <div class="field"><label for="st-goal">დღის მიზანი (საათი)</label><input class="f num" id="st-goal" type="number" inputmode="decimal" min="1" max="24" value="${S.goal}"></div>
    <div class="field"><label>ფონი</label><div class="switch">
      <button data-theme-set="dark" class="${S.theme === 'dark' ? 'on' : ''}">🌙 მუქი</button>
      <button data-theme-set="light" class="${S.theme === 'light' ? 'on' : ''}">☀️ ნათელი</button></div></div>
    <button class="btn primary" id="st-save">შენახვა</button>
    <button class="btn ghost" style="margin-top:10px;color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))" id="st-reset">ყველაფრის წაშლა</button>
    <p class="muted small" style="text-align:center;margin:14px 0 0">ყველა მონაცემი ინახება მხოლოდ ამ ტელეფონში.</p>`);
  document.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => {
    S.theme = b.dataset.themeSet; applyTheme(); save();
    document.querySelectorAll('[data-theme-set]').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#st-save').onclick = () => {
    S.name = $('#st-name').value.trim();
    const g = parseFloat($('#st-goal').value); if (g > 0 && g <= 24) S.goal = g;
    save(); closeSheet(); render(); toast('შენახულია');
  };
  $('#st-reset').onclick = () => openConfirm('წავშალო ყველა ჩანაწერი? ეს ვერ დაბრუნდება.', 'კი, წაშალე', () => {
    const theme = S.theme; S = DEFAULT(); S.theme = theme; S.expenses = []; save(); toast('ყველაფერი წაიშალა');
  });
}
function applyTheme(){
  document.documentElement.dataset.theme = S.theme;
  document.querySelector('meta[name=theme-color]').content = S.theme === 'light' ? '#F4F5F7' : '#0E1014';
}

/* ============ ღილაკები ============ */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('.tab');
  if (tabBtn) { go(tabBtn.dataset.tab); return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  const find = (arr) => arr.find(x => x.id === id);
  switch (a) {
    case 'open-settings': openSettings(); break;
    case 'rate-dec': setRate(Math.max(0, (+S.rate || 0) - 1)); $('#rate').value = S.rate; break;
    case 'rate-inc': setRate((+S.rate || 0) + 1); $('#rate').value = S.rate; break;
    case 'shift': toggleShift(); break;
    case 'add-time': openForm({ title: 'ნამუშევარი საათების ჩაწერა', saveLabel: 'დამატება',
        fields: [{ key: 'h', label: 'საათი', type: 'number', ph: '0', optional: true }, { key: 'm', label: 'წუთი', type: 'number', ph: '0', optional: true }],
        onSave: v => { const min = (+v.h || 0) * 60 + (+v.m || 0); if (min > 0) { addWork(min); toast(`დაემატა ${fmtH(min / 60)}`); } } }); break;
    case 'edit-goal': openForm({ title: 'დღის მიზანი', data: { goal: S.goal }, fields: [{ key: 'goal', label: 'დღეში რამდენი საათი?', type: 'number', positive: true }],
        onSave: v => { if (v.goal > 0 && v.goal <= 24) S.goal = v.goal; } }); break;
    case 'exp-add': openForm({ title: 'ახალი ხარჯი', fields: EXP_FIELDS, saveLabel: 'დამატება',
        onSave: v => S.expenses.push({ id: uid(), paid: false, ...v }) }); break;
    case 'exp-edit': { const x = find(S.expenses); if (!x) break; openForm({ title: 'ხარჯის შეცვლა', fields: EXP_FIELDS, data: x,
        onSave: v => { Object.assign(x, v); delete x.sample; }, onDelete: () => { S.expenses = S.expenses.filter(y => y !== x); } }); break; }
    case 'exp-toggle': { const x = find(S.expenses); if (!x) break; x.paid = !x.paid; save(); $('#exp-box').innerHTML = viewExpenses();
        if (x.paid) toast(`✓ ${x.name} — გადახდილია!`); break; }
    case 'disc-cat': discCat = el.dataset.v; render(); break;
    case 'disc-add': openForm({ title: 'ახალი ფასდაკლება', fields: DISC_FIELDS, saveLabel: 'დამატება', data: { cat: discCat === 'all' ? 'food' : discCat },
        onSave: v => S.discounts.unshift({ id: uid(), ...v }) }); break;
    case 'disc-edit': { const x = find(S.discounts); if (!x) break; openForm({ title: 'ფასდაკლების შეცვლა', fields: DISC_FIELDS, data: x,
        onSave: v => { Object.assign(x, v); delete x.sample; }, onDelete: () => { S.discounts = S.discounts.filter(y => y !== x); } }); break; }
    case 'sos-prob': sosProb = el.dataset.v; render(); break;
    case 'sos-loc': findLocation(); break;
    case 'sos-sms': if (!S.contacts.length) { e.preventDefault(); toast('ჯერ დაამატე კურიერები'); } else toast('იხსნება SMS…'); break;
    case 'contact-add': openForm({ title: 'კურიერის დამატება', fields: CONTACT_FIELDS, saveLabel: 'დამატება',
        onSave: v => S.contacts.push({ id: uid(), ...v }) }); break;
    case 'contact-edit': { if (e.target.closest('.call')) break; const x = find(S.contacts); if (!x) break; openForm({ title: 'კურიერის შეცვლა', fields: CONTACT_FIELDS, data: x,
        onSave: v => Object.assign(x, v), onDelete: () => { S.contacts = S.contacts.filter(y => y !== x); } }); break; }
    case 'phrase-next': S.phraseShift++; save(); render(); break;
    case 'phrase-copy': { const p = phrase(); const txt = `„${p.t}“ — ${p.a}`;
        try { navigator.clipboard.writeText(txt).then(() => toast('დაკოპირდა ✓'), () => toast('ვერ დაკოპირდა')); } catch (err) { toast('ვერ დაკოპირდა'); } break; }
    case 'open-work': openWork(id); break;
    case 'close-reader': closeReader(); break;
    case 'font-inc': S.font = Math.min(30, S.font + 2); $('#r-inner').style.fontSize = S.font + 'px'; save(); break;
    case 'font-dec': S.font = Math.max(14, S.font - 2); $('#r-inner').style.fontSize = S.font + 'px'; save(); break;
    case 'job-type': jobType = el.dataset.v; render(); break;
    case 'job-add': openForm({ title: 'ახალი განცხადება', fields: JOB_FIELDS, saveLabel: 'დამატება', data: { type: jobType },
        onSave: v => { S.jobs.unshift({ id: uid(), ...v }); jobType = v.type; } }); break;
    case 'job-edit': { if (e.target.closest('a')) break; const x = find(S.jobs); if (!x) break; openForm({ title: 'განცხადების შეცვლა', fields: JOB_FIELDS, data: x,
        onSave: v => { Object.assign(x, v); delete x.sample; jobType = v.type; }, onDelete: () => { S.jobs = S.jobs.filter(y => y !== x); } }); break; }
  }
});

/* ციფრების ველები — გადახატვის გარეშე, რომ კლავიატურა არ დაიხუროს */
function setRate(v){
  S.rate = v; save();
  if ($('#exp-box')) $('#exp-box').innerHTML = viewExpenses();
  updateCalc(); tick();
}
function updateCalc(){
  const r = +S.rate || 0, h = $('#c-h'), m = $('#c-m'); if (!h) return;
  const hv = parseFloat(h.value || h.placeholder), mv = parseFloat(m.value || m.placeholder);
  $('#c-h-r').textContent = '→ ' + money(hv * r);
  $('#c-m-r').textContent = '→ ' + (r ? fmtH(mv / r) : '—');
}
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'rate') { const v = parseFloat(e.target.value.replace(',', '.')); if (v >= 0) setRate(v); }
  if (id === 'c-h' || id === 'c-m') updateCalc();
  if (id === 'fuel') { todayLog().fuel = Math.max(0, parseFloat(e.target.value) || 0); save(); tick(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (!$('#reader').hidden) closeReader(); }
});

  const d = new Date();
  $('#today-label').textContent = `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  applyTheme(); go(tab);
})();
</script>
